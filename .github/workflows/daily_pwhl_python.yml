name: Update PWHL Data (Python)

# Python port of the PWHL compiler (python/pwhl_data_build). Reads the per-game
# final.json from fastRhockey-pwhl-raw, compiles the season-level datasets, and publishes
# parquet + rds + csv to the sportsdataverse-data pwhl_* releases — the same outputs as the
# R daily_pwhl.yml, which is now de-scheduled.
#
# Validated against R's committed 2024 parquet: 11 of 12 comparable datasets match exactly
# on rows and columns. pbp/shifts differ only because R's committed 2024 artifacts predate
# the raw enrichment fields; python's columns are a strict superset over the same 85 games.
#
# Credential scoping: the cross-repo publish PAT (SDV_GH_TOKEN) is set only on the publish
# step; both checkouts set persist-credentials:false.
# Serialize every workflow in this repo that commits to it. Two runs in flight put
# one of them behind origin and its push is rejected -- and where the git calls
# are swallowed with no rc check, that lands as a GREEN job that published
# nothing. Worked examples: wehoop-wnba-data runs 32192069433 + 32192069566, and
# hoopR-nba-data run 32204419012, all on 2026-08-18/19.
#
# cancel-in-progress is FALSE on purpose -- these runs upload release assets, and
# cancelling mid-upload leaves a tag half-updated. Queue instead.
concurrency:
  group: ${{ github.repository }}-commit
  cancel-in-progress: false

on:
  schedule:
    # Mirrors the retired daily_pwhl.yml cadence.
    - cron: '0 9 * 11-12 *'  # regular season (Nov-Dec)
    - cron: '0 9 * 1-3 *'    # regular season (Jan-Mar)
    - cron: '0 9 * 4-5 *'    # playoffs (Apr-May)
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Start season end-year (e.g. 2026 for 2025-26)'
        required: false
        type: string
      end_year:
        description: 'End season end-year (default: start)'
        required: false
        type: string
      publish:
        description: 'Publish datasets to sportsdataverse-data releases'
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [daily_pwhl_data]

permissions:
  contents: write

jobs:
  pwhl_data_python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout pwhl-data
        uses: actions/checkout@v5
        with:
          persist-credentials: false  # the commit-back step authenticates the push explicitly

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Sync deps
        run: uv sync

      - name: Resolve season range
        id: years
        env:  # bind user inputs to env vars — never expand them into the shell source directly
          IN_START: ${{ github.event.inputs.start_year }}
          IN_END: ${{ github.event.inputs.end_year }}
          PAYLOAD_MSG: ${{ github.event.client_payload.commit_message }}
        run: |
          START="$IN_START"; END="$IN_END"

          # A repository_dispatch from pwhl-raw carries the upstream commit subject, whose
          # first and last integers are the season range ("PWHL Raw Updated (Start: 2026
          # End: 2026)"). Same parse the R workflow used — without it a dispatch silently
          # falls through to the date guess below, so a raw-side backfill of an older
          # season would compile the current one instead.
          if [ -z "$START" ] && [ -n "$PAYLOAD_MSG" ]; then
            START=$(printf '%s' "$PAYLOAD_MSG" | grep -o -E '[0-9]+' | head -1)
            END=$(printf '%s' "$PAYLOAD_MSG" | grep -o -E '[0-9]+' | tail -1)
          fi

          if [ -z "$START" ]; then
            Y=$(date +%Y); M=$(date +%m)
            START=$([ "$M" -ge 8 ] && echo $((Y + 1)) || echo "$Y")   # PWHL season end-year
          fi
          END="${END:-$START}"

          # validate integers before any reuse (reject crafted values)
          case "$START" in ''|*[!0-9]*) echo "invalid start_year: $START" >&2; exit 1;; esac
          case "$END" in ''|*[!0-9]*) echo "invalid end_year: $END" >&2; exit 1;; esac
          # the grep above takes whatever integers the subject happens to contain, so
          # reject anything that isn't a plausible season end-year rather than compiling it
          for Y in "$START" "$END"; do
            if [ "$Y" -lt 2024 ] || [ "$Y" -gt 2100 ]; then
              echo "implausible season year: $Y (from '$PAYLOAD_MSG')" >&2; exit 1
            fi
          done
          [ "$START" -le "$END" ] || { echo "start $START after end $END" >&2; exit 1; }
          echo "start=$START" >> "$GITHUB_OUTPUT"; echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Compile season datasets
        run: |
          for y in $(seq ${{ steps.years.outputs.start }} ${{ steps.years.outputs.end }}); do
            # Track B: --raw-root defaults to raw.githubusercontent — schedule + finals over HTTP
            # One numbered creation stage per dataset family (generated
            # from the config DATASETS registry).
            for f in python/pwhl_data_[0-9][0-9]_*_creation.py; do
              mod=$(basename "$f" .py)
              uv run python -m "$mod" -s "$y" \
                --out "$GITHUB_WORKSPACE/pwhl"
            done
          done

      - name: Publish to sportsdataverse-data releases
        if: ${{ github.event.inputs.publish != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.SDV_GH_TOKEN }}
        run: |
          uv run python -m pwhl_data_02_publish \
            -s ${{ steps.years.outputs.start }} -e ${{ steps.years.outputs.end }} \
            --out-dir "$GITHUB_WORKSPACE/pwhl"

      - name: Commit compiled parquets
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # rds/csv are gitignored — they ship to the releases only.
          git add pwhl
          git commit -m "PWHL Data Updated (Start: ${{ steps.years.outputs.start }} End: ${{ steps.years.outputs.end }})" || echo "no changes"
          # persist-credentials:false on checkout — authenticate the push explicitly so the
          # write token isn't left in the runner's git config for later steps to reuse.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}" || echo "nothing to push"
