[project]
name = "pwhl-model-publish"
version = "0.1.0"
description = "PWHL model-dataset publisher (xG-enriched shots) for sportsdataverse-data releases"
requires-python = ">=3.10"
dependencies = [
    "sportsdataverse @ git+https://github.com/sportsdataverse/sportsdataverse-py@main",
    "polars>=1.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.0",
    "numpy>=1.24",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["pwhl_model_publish*", "pwhl_data_build*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E712"]
